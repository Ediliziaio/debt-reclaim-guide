<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon & touch icons (Tutela Debito brand: navy square + gold TD) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Site-wide invariants only. Per-page metadata (title, description, canonical,
         keywords, Open Graph, Twitter, JSON-LD) is injected per route by the
         vite-react-ssg Head component (src/components/SEO.tsx) during prerender,
         so it is intentionally not duplicated in this template. -->
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="Italian" />
    <meta name="geo.region" content="IT" />
    <meta name="geo.placename" content="Napoli, Milano, Torino" />
    <meta name="theme-color" content="#2a3f5f" />

    <!-- Font self-hosted (vedi scripts/fetch-fonts.mjs): niente richieste a
         domini terzi sul percorso critico. Si preloada il solo subset latino
         in tondo, che copre tutto il testo visibile appena la pagina apre;
         corsivo e latin-ext restano a caricamento normale. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-tight-latin.woff2"
      crossorigin
    />
